<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miluc.Client</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />

    <!-- Estilos Frameworks y Librerías -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" />
    <link rel="stylesheet" href="_content/Syncfusion.Blazor.Themes/bootstrap5.css" />

    <!-- Estilos Locales -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="Miluc.Client.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Scripts en Head (Librerías dependientes de UI) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Blazor WASM Framework -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Syncfusion Script Interop -->
    <script src="_content/Syncfusion.Blazor.Core/scripts/syncfusion-blazor.min.js" type="text/javascript"></script>

    <!-- Scripts Personalizados -->
    <script src="js/CrearPedido.js"></script>
    <script>
        window.idleHelper = {
            registerActivity: function (dotnetHelper) {
                document.addEventListener("mousemove", () => dotnetHelper.invokeMethodAsync("ResetTimer"));
                document.addEventListener("keydown", () => dotnetHelper.invokeMethodAsync("ResetTimer"));
                document.addEventListener("click", () => dotnetHelper.invokeMethodAsync("ResetTimer"));
            }
        };
    </script>
</body>
</html>
